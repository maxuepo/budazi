# 示例配置。想改设置时：把这个文件复制一份，命名为 config.toml 再改（config.toml 不会被提交到 git）。
# 没有 config.toml 时程序就用这个文件。改完重启程序生效。

hotkey = "ctrl"            # 按住说话的键：ctrl（左右都行）/ ctrl_r（只认右 Ctrl）/ alt_r（右 Alt / 右 Option）/ f13 ...
min_hold_ms = 300          # 按得比这短就当误触
ui_delay_ms = 200          # 按住超过这么久才显示"录音中"（Ctrl+C 这类快捷键不会闪提示）；录音从按下就开始，不丢字
language = "auto"          # 语音识别语言：auto / zh / en / ja / ko / yue
asr_threads = 4            # 语音识别用的 CPU 线程数，一般设成 CPU 核数

# ---------------- AI 润色 ----------------
# 识别出来的文字会发给下面配置的大模型去整理（去口头禅、改口误、理顺逻辑）。
# polish = false 时完全离线，只输出识别原文。
polish = true
polish_level = "strong"    # light 轻度 / strong 重度 / concise 精炼 / restructure 梳理（托盘菜单可切换）

# ---- 方案 A：云端（默认 Fireworks，任何兼容 OpenAI 接口的服务都行）----
# API key 放在环境变量 FIREWORKS_API_KEY，或者项目目录下的 api_key.txt（第一行写 key）。
polish_base_url = "https://api.fireworks.ai/inference/v1"
api_key_env = "FIREWORKS_API_KEY"
polish_model = "accounts/fireworks/routers/deepseek-v4p1-flash-1017-ultrafast"   # 快，便宜
long_model = "accounts/fireworks/routers/kimi-k3-fast"   # 长段口述用更聪明的模型（贵约 15 倍）
long_min_chars = 60        # 识别结果达到这么多字就用 long_model；设成 99999 就等于不用
long_model_levels = ["light", "strong"]

# ---- 方案 B：完全本地（Ollama），不需要 key，文字不出电脑 ----
# 1. 安装 Ollama：https://ollama.com    2. 命令行运行：ollama pull qwen3:8b
# 3. 把上面方案 A 的四行（polish_base_url / polish_model / long_model / [level_models] 里的模型）换成：
# polish_base_url = "http://localhost:11434/v1"
# polish_model = "qwen3:8b"
# long_model = "qwen3:8b"
# 本地模型比云端慢、整理效果也弱一些，但完全离线。LM Studio 用 http://localhost:1234/v1。

polish_timeout_s = 6.0     # 云端超时就退回快模型，再不行就粘贴原文（本地模型自动放宽到 30 秒）
skip_polish_under_chars = 6

# ---------------- 其他 ----------------
keep_recordings = 0        # 保存最近 N 次录音到 recordings/ 方便排查识别问题；0 = 不保存（默认）
beep = true
overlay = true             # 屏幕底部显示"录音中 / 整理中 / 已输入"的小浮条（仅 Windows；macOS 看菜单栏图标颜色）
restore_clipboard = true

# 按前台程序调整风格。Windows 用进程名（小写，如 code.exe），macOS 用 App 名（小写，如 code）
[app_styles]
"code.exe" = "用户在 VS Code 里给 AI 编程助手写指令，保留所有代码标识符和文件名。"
"windowsterminal.exe" = "用户在终端里给 AI agent 写指令，保留命令、路径和代码标识符。"
"cursor.exe" = "用户在 Cursor 里给 AI 编程助手写指令，保留所有代码标识符和文件名。"
"weixin.exe" = "用户在微信聊天，语气口语、简洁，不要用列表。"
# macOS
"code" = "用户在 VS Code 里给 AI 编程助手写指令，保留所有代码标识符和文件名。"
"terminal" = "用户在终端里给 AI agent 写指令，保留命令、路径和代码标识符。"
"iterm2" = "用户在终端里给 AI agent 写指令，保留命令、路径和代码标识符。"
"cursor" = "用户在 Cursor 里给 AI 编程助手写指令，保留所有代码标识符和文件名。"
"wechat" = "用户在微信聊天，语气口语、简洁，不要用列表。"
"微信" = "用户在微信聊天，语气口语、简洁，不要用列表。"

# 某些档位不管长短都用指定模型（梳理要补逻辑、调顺序，需要更聪明的模型）
[level_models]
restructure = "accounts/fireworks/routers/kimi-k3-fast"
