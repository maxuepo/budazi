[project]
name = "budazi"
version = "0.1.0"
description = "Hold-to-talk voice typing for Windows and macOS (local SenseVoice + LLM cleanup)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pynput>=1.8.2",
    "pyperclip>=1.11.0",
    "pystray>=0.19.5",
    "sherpa-onnx>=2.0.1",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    # macOS only: frontmost app (AppKit) and main-thread UI updates (PyObjCTools)
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
]

[tool.uv]
package = false
